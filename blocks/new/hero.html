<section class="hero">
  <video class="hero__bg" loop autoplay muted playsinline preload="metadata">
    <source src="img/existing/video/hero.mp4" type="video/mp4" />
  </video>

  <div class="container">
    <div class="hero__box">
      <div class="hero__heading">
        <div class="hero__line"></div>
        <h1 class="hero__title">
          Клинкерная плитка <br />
          от казахстанского <br />
          производителя по <br />
          выгодной цене
        </h1>
      </div>

      <div class="hero__stats">
        <div class="hero-stat">
          <h2 class="hero-stat__num">1 000 000 м&sup2;</h2>
          <p class="hero-stat__desc">мощность производства в год</p>
        </div>

        <div class="hero__statline"></div>

        <div class="hero-stat hero-stat_offset">
          <h2 class="hero-stat__num">50+ лет</h2>
          <p class="hero-stat__desc">срок службы материала</p>
        </div>

        <div class="hero__statline"></div>

        <div class="hero-stat hero-stat_offset">
          <h2 class="hero-stat__num">2027</h2>
          <p class="hero-stat__desc">запуск производства</p>
        </div>
      </div>

      <a href="#" class="button hero__btn">Скачать каталог</a>
    </div>
  </div>
</section>
